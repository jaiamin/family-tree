<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<script>
  try { if (localStorage.getItem("theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch {}
</script>
<style>
  :root {
    --bg: #fafafa; --surface: #ffffff; --fg: #09090b; --muted: #71717a; --border: #e4e4e7;
    --border-strong: #a1a1aa; --line: #c4c4cc; --line-on: #09090b; --chip: #f4f4f5;
    --shadow: 0 1px 2px rgb(0 0 0 / .05); --shadow-lg: 0 12px 32px -8px rgb(0 0 0 / .18), 0 2px 6px rgb(0 0 0 / .06);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #09090b; --surface: #18181b; --fg: #fafafa; --muted: #a1a1aa; --border: #27272a;
    --border-strong: #52525b; --line: #3f3f46; --line-on: #fafafa; --chip: #27272a;
    --shadow: none; --shadow-lg: 0 12px 32px -8px rgb(0 0 0 / .6);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; overflow: hidden; background: var(--bg); color: var(--fg);
    font: 14px/1.45 Geist, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--fg); color: var(--bg); }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  svg.icon { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  header {
    display: flex; align-items: center; gap: 8px; padding: 12px max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left));
    padding-top: max(12px, env(safe-area-inset-top)); border-bottom: 1px solid var(--border); background: var(--surface); z-index: 3;
  }
  .title { min-width: 0; flex: 1; }
  h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .count { color: var(--muted); font-size: 13px; }
  .search { position: relative; width: min(320px, 40vw); }
  .actions { display: flex; gap: 8px; }
  .icon-button {
    display: grid; place-items: center; width: 36px; height: 36px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--muted); cursor: pointer; transition: background-color .15s, color .15s;
  }
  .icon-button:hover { background: var(--chip); color: var(--fg); }
  .icon-button svg.icon { width: 16px; height: 16px; }
  :root:not([data-theme="dark"]) .sun, :root[data-theme="dark"] .moon { display: none; }
  .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .search input {
    width: 100%; height: 36px; padding: 0 12px 0 34px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .search input::placeholder { color: var(--muted); }
  .search input::-webkit-search-cancel-button { -webkit-appearance: none; }
  .search input:focus { border-color: var(--border-strong); box-shadow: 0 0 0 3px var(--chip); }
  .results {
    position: absolute; top: calc(100% + 6px); right: 0; left: 0; margin: 0; padding: 4px; list-style: none;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-lg); max-height: 320px; overflow: auto;
  }
  .results li { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
  .results li[aria-selected="true"] { background: var(--chip); }
  .results .empty { color: var(--muted); cursor: default; }

  main { position: relative; flex: 1; overflow: hidden; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
  main.dragging { cursor: grabbing; }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #stage.glide { transition: transform .45s cubic-bezier(.16, 1, .3, 1); }
  #lines { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  #lines path { fill: none; stroke: var(--line); stroke-width: 1.5; }
  #lines path.on { stroke: var(--line-on); stroke-width: 2; }
  #lines path.dot { fill: var(--line); stroke: none; }
  #lines path.dot.on { fill: var(--line-on); }

  .person {
    position: absolute; display: flex; align-items: center; gap: 10px; padding: 0 12px; text-align: left; cursor: pointer;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow);
    transition: border-color .15s, box-shadow .15s, opacity .2s;
  }
  .person:hover { border-color: var(--border-strong); }
  /* A ring of its own, so joined couple cards (which drop a border) and zoom rounding can't eat an edge. */
  .person.selected { z-index: 1; }
  .person.selected::after {
    content: ""; position: absolute; inset: -1px; border: 2px solid var(--fg); border-radius: inherit; pointer-events: none;
  }
  .person.pair-top { border-bottom-width: 0; border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .person.pair-middle { border-bottom-width: 0; border-radius: 0; box-shadow: none; }
  .person.pair-bottom { border-top-left-radius: 0; border-top-right-radius: 0; }
  .person.pair-top { box-shadow: none; }
  .person.unknown { border-style: dashed; box-shadow: none; background: transparent; color: var(--muted); }
  .dim .person:not(.related) { opacity: .45; }
  .avatar {
    display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; flex: none;
    background: var(--chip); color: var(--fg); font-size: 12px; font-weight: 600; letter-spacing: .02em;
  }
  .avatar.lg { width: 56px; height: 56px; font-size: 17px; }
  .avatar { position: relative; overflow: hidden; }
  .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #card .photo { position: relative; flex: none; padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; }
  #card .photo .badge {
    position: absolute; right: -2px; bottom: -2px; display: grid; place-items: center; width: 22px; height: 22px;
    border: 1px solid var(--border); border-radius: 50%; background: var(--surface); color: var(--fg);
  }
  #card .photo .badge svg.icon { width: 12px; height: 12px; }
  #card .photo:hover .avatar { filter: brightness(.94); }
  .photo-panel { display: grid; gap: 8px; margin-top: 12px; }
  .photo-panel[hidden] { display: none; }
  .photo-panel, .photo-panel form { grid-template-columns: minmax(0, 1fr); }
  .photo-panel form { display: grid; gap: 8px; }
  .photo-panel .row { display: flex; gap: 8px; }
  .photo-panel input[type="text"] {
    flex: 1; min-width: 0; height: 36px; padding: 0 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); outline: none; font-size: 14px;
  }
  .photo-panel input[type="text"]:focus { border-color: var(--border-strong); box-shadow: 0 0 0 3px var(--chip); }
  .photo-panel .status { margin: 0; font-size: 13px; color: var(--muted); }
  .photo-panel .status.error { color: var(--fg); font-weight: 500; }
  .name { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .years { display: block; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .person .text { min-width: 0; }

  .zoom {
    position: absolute; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); z-index: 2;
    display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden;
  }
  .zoom button { display: grid; place-items: center; width: 36px; height: 36px; border: 0; background: none; cursor: pointer; }
  .zoom button + button { border-top: 1px solid var(--border); }
  .zoom button:hover { background: var(--chip); }

  #card {
    position: absolute; z-index: 4; width: 320px; max-height: calc(100% - 32px); overflow: auto; padding: 16px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-lg); cursor: auto; user-select: text; -webkit-user-select: text;
  }
  #card:not(.waiting) { animation: rise .2s cubic-bezier(.16, 1, .3, 1); }
  #card.waiting { visibility: hidden; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
  #card .top { display: flex; align-items: center; gap: 12px; padding-right: 28px; }
  #card h2 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  #card .close { position: absolute; top: 10px; right: 10px; display: grid; place-items: center; width: 28px; height: 28px; border: 0; border-radius: 6px; background: none; color: var(--muted); cursor: pointer; }
  #card .close:hover { background: var(--chip); color: var(--fg); }
  #card dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 14px 0 0; font-size: 13px; }
  #card dt { color: var(--muted); }
  #card dd { margin: 0; }
  #card .notes { margin: 12px 0 0; font-size: 13px; white-space: pre-line; }
  #card section { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
  #card h3 { margin: 0 0 6px; font-size: 12px; font-weight: 500; color: var(--muted); }
  .relative {
    display: flex; align-items: center; gap: 10px; padding: 7px 8px; margin: 0 -8px; width: calc(100% + 16px);
    border: 0; border-radius: 8px; background: none; text-align: left; cursor: pointer;
  }
  .relative:hover { background: var(--chip); }
  .relative .name { min-width: 0; }
  .relative .note { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
  #card .actions { display: flex; gap: 8px; margin-top: 16px; }
  #card .action {
    flex: 1; height: 36px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; white-space: nowrap;
    background: var(--surface); font-size: 13px; font-weight: 500; cursor: pointer; transition: background-color .15s;
  }
  #card .action:hover, #card .action[aria-pressed="true"] { background: var(--chip); }
  #card .action.primary { flex: none; border-color: var(--fg); background: var(--fg); color: var(--bg); }
  #card .action:disabled { opacity: .6; cursor: default; }
  #card .who { min-width: 0; }
  #card .none { margin: 14px 0 0; color: var(--muted); font-size: 13px; }
  .empty-tree { display: grid; place-items: center; height: 100%; color: var(--muted); }

  @media (max-width: 640px) {
    header { gap: 8px; }
    .count { display: none; }
    #card {
      position: fixed; left: 0; right: 0; bottom: 0; top: auto !important; width: auto; max-height: 70vh;
      border-radius: 16px 16px 0 0; padding-bottom: max(16px, env(safe-area-inset-bottom));
    }
    #card:not(.waiting) { animation-name: sheet; }
    @keyframes sheet { from { transform: translateY(24px); opacity: 0; } }
  }
  @media (prefers-reduced-motion: reduce) { #stage.glide, #card { transition: none; animation: none; } }
</style>
</head>
<body>
<header>
  <div class="title">
    <h1 id="title"></h1>
    <div class="count" id="count"></div>
  </div>
  <div class="search">
    <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="search" type="search" placeholder="Find a person" autocomplete="off" aria-label="Find a person"
      role="combobox" aria-expanded="false" aria-controls="results">
    <ul class="results" id="results" role="listbox" hidden></ul>
  </div>
  <div class="actions">
    <a class="icon-button" href="https://github.com/jaiamin/family-tree-mcp" target="_blank" rel="noopener" aria-label="family-tree-mcp on GitHub" title="GitHub">
      <svg class="icon" viewBox="0 0 24 24"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
    </a>
    <button class="icon-button" id="theme" aria-label="Switch light or dark mode" title="Light or dark">
      <svg class="icon moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      <svg class="icon sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>
  </div>
</header>
<main id="view" aria-label="Family tree">
  <div id="stage"><svg id="lines"></svg></div>
  <div class="zoom">
    <button id="zoom-in" aria-label="Zoom in"><svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button id="zoom-out" aria-label="Zoom out"><svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button id="zoom-fit" aria-label="Show everyone"><svg class="icon" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></button>
  </div>
</main>

<script>
const tree = JSON.parse(document.getElementById("tree-data").textContent);
const ids = Object.keys(tree.people);
const $ = (id) => document.getElementById(id);
const view = $("view");
const stage = $("stage");
const svgNS = "http://www.w3.org/2000/svg";
const PLACEHOLDER = /^Unknown parent of /;

const person = (id) => tree.people[id];
const displayName = (id) => (PLACEHOLDER.test(person(id).name) ? "Unknown" : person(id).name);
const initials = (id) =>
  PLACEHOLDER.test(person(id).name) ? "?" : (person(id).name.match(/\p{L}+/gu) || ["?"]).slice(0, 2).map((w) => w[0]).join("").toUpperCase();
const year = (date) => date?.match(/\d{4}/)?.[0] || date;
function years(p) {
  if (p.birth_date && p.death_date) return `${year(p.birth_date)}–${year(p.death_date)}`;
  if (p.birth_date) return `b. ${year(p.birth_date)}`;
  if (p.death_date) return `d. ${year(p.death_date)}`;
  return "";
}
// "1915–1998 · 83 years" when both years are known.
function lifespan(p) {
  const [born, died] = [p.birth_date, p.death_date].map((d) => Number(d?.match(/\d{4}/)?.[0]));
  return born && died && died >= born ? `${years(p)} · ${died - born} years` : "";
}
function el(tag, attrs = {}, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "class" ? (node.className = v) : node.setAttribute(k, v);
  node.append(...kids.filter((k) => k != null && k !== ""));
  return node;
}
// Photos: shown wherever a person's initials are, and changed from their card with the family
// code. Only published sites have them, served by the site's /api/photos function.
const PHOTOS = Boolean(tree.photos);
let photos = {}; // person id -> photo version
function paint(circle) {
  circle.querySelector("img")?.remove();
  const id = circle.dataset.avatar;
  if (!photos[id]) return;
  const img = el("img", { src: `/api/photos/${id}?v=${photos[id]}`, alt: "", decoding: "async" });
  img.onerror = () => img.remove();
  circle.append(img);
}
const repaint = (id) => document.querySelectorAll(`[data-avatar="${id}"]`).forEach(paint);
function avatar(id, size = "") {
  const circle = el("span", { class: `avatar ${size}`, "aria-hidden": "true", "data-avatar": id }, initials(id));
  paint(circle);
  return circle;
}

$("theme").onclick = () => {
  const dark = document.documentElement.dataset.theme !== "dark";
  dark ? (document.documentElement.dataset.theme = "dark") : delete document.documentElement.dataset.theme;
  try { localStorage.setItem("theme", dark ? "dark" : "light"); } catch {}
};
$("title").textContent = tree.name;
$("count").textContent = `${ids.length} ${ids.length === 1 ? "person" : "people"}`;
document.title = tree.name;

// Tree

const { pos, spine, hang, pair, family, portrait, card, gap, width, height } = layout(tree, { width: innerWidth, height: innerHeight - 64 });
const PAD = 48;
stage.style.width = `${width + PAD * 2}px`;
stage.style.height = `${height + PAD * 2}px`;
const lines = $("lines");
lines.setAttribute("width", width + PAD * 2);
lines.setAttribute("height", height + PAD * 2);
const at = (id) => ({ x: Math.round(pos[id].x) + PAD, y: Math.round(pos[id].y) + PAD });

const cards = {};
for (const id of ids) {
  const p = person(id);
  const node = el(
    "button",
    { class: `person${PLACEHOLDER.test(p.name) ? " unknown" : ""}${pair[id] ? ` pair-${pair[id]}` : ""}`, "data-id": id, "aria-label": `${p.name}${years(p) ? `, ${years(p)}` : ""}` },
    avatar(id),
    el("span", { class: "text" }, el("span", { class: "name" }, displayName(id)), years(p) && el("span", { class: "years" }, years(p))),
  );
  Object.assign(node.style, { left: `${at(id).x}px`, top: `${at(id).y}px`, width: `${card.w}px`, height: `${card.h}px` });
  stage.append(node);
  cards[id] = node;
}

const edges = [];
function edge(d, kind, people, className = "") {
  const path = document.createElementNS(svgNS, "path");
  path.setAttribute("d", d);
  if (className) path.setAttribute("class", className);
  lines.append(path);
  edges.push({ path, kind, people });
  return path;
}
for (const e of connections(tree, { pos, spine, hang, pair, family, card, gap }, PAD)) {
  edge(e.d, e.kind, e.people, e.className);
}

// Pan and zoom

const camera = { x: 0, y: 0, scale: 1 };
function apply(glide = false) {
  stage.classList.toggle("glide", glide);
  stage.style.transform = `translate(${camera.x}px, ${camera.y}px) scale(${camera.scale})`;
  place();
}
function zoomAt(scale, cx = view.clientWidth / 2, cy = view.clientHeight / 2, glide = false) {
  scale = Math.min(2, Math.max(0.15, scale));
  camera.x = cx - ((cx - camera.x) * scale) / camera.scale;
  camera.y = cy - ((cy - camera.y) * scale) / camera.scale;
  camera.scale = scale;
  apply(glide);
}
function fit(glide = false) {
  const w = width + PAD * 2;
  const h = height + PAD * 2;
  // Phones fit the width and scroll down; wider screens fit everyone.
  camera.scale = Math.min(1, view.clientWidth / w, portrait ? 1 : view.clientHeight / h);
  camera.x = (view.clientWidth - w * camera.scale) / 2;
  camera.y = Math.max(0, (view.clientHeight - h * camera.scale) / 2);
  apply(glide);
}
// The part of the screen left free by the person's card: the top on phones, the left otherwise.
function room() {
  const narrow = matchMedia("(max-width: 640px)").matches;
  const sheet = narrow ? $("card")?.offsetHeight || view.clientHeight * 0.55 : 0;
  return { w: view.clientWidth * (narrow ? 1 : 0.68), h: Math.max(120, view.clientHeight - sheet) };
}
function bounds(group) {
  const xs = group.map((g) => at(g).x);
  const ys = group.map((g) => at(g).y);
  return { x: Math.min(...xs), y: Math.min(...ys), w: Math.max(...xs) - Math.min(...xs) + card.w, h: Math.max(...ys) - Math.min(...ys) + card.h };
}
function inView(group) {
  const b = bounds(group);
  const { w, h } = room();
  const [x, y, s] = [camera.x, camera.y, camera.scale];
  return x + b.x * s >= 0 && y + b.y * s >= 0 && x + (b.x + b.w) * s <= w && y + (b.y + b.h) * s <= h && s >= 0.6;
}
// Frames the person with their line, zooming out only as far as needed.
function centreOn([id, ...group]) {
  const b = bounds([id, ...group]);
  const { w, h } = room();
  const scale = Math.max(0.6, Math.min(1, (w - 48) / b.w, (h - 48) / b.h));
  camera.scale = scale;
  camera.x = w / 2 - (b.x + b.w / 2) * scale;
  // Near the top rather than centred: trees grow downward, so this shows more of the family below.
  camera.y = Math.min(h / 2 - (b.y + b.h / 2) * scale, 64 - b.y * scale);
  // When the whole line can't fit at a readable size, keep the person in view.
  const p = at(id);
  const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);
  camera.x = clamp(camera.x, 24 - p.x * scale, w - 24 - (p.x + card.w) * scale);
  camera.y = clamp(camera.y, 24 - p.y * scale, h - 24 - (p.y + card.h) * scale);
  const before = stage.style.transform;
  apply(true);
  return stage.style.transform !== before;
}

const pointers = new Map();
let moved = false;
let pinch = null;
view.addEventListener("pointerdown", (e) => {
  if (e.target.closest("#card, .zoom")) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  moved = false;
  if (pointers.size === 2) {
    const [p, q] = [...pointers.values()];
    pinch = { dist: Math.hypot(p.x - q.x, p.y - q.y), scale: camera.scale };
  }
});
view.addEventListener("pointermove", (e) => {
  const last = pointers.get(e.pointerId);
  if (!last) return;
  const dx = e.clientX - last.x;
  const dy = e.clientY - last.y;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2 && pinch) {
    const [p, q] = [...pointers.values()];
    const box = view.getBoundingClientRect();
    zoomAt((pinch.scale * Math.hypot(p.x - q.x, p.y - q.y)) / pinch.dist, (p.x + q.x) / 2 - box.left, (p.y + q.y) / 2 - box.top);
    moved = true;
  } else if (pointers.size === 1 && (moved || Math.abs(dx) + Math.abs(dy) > 3)) {
    if (!moved) view.setPointerCapture(e.pointerId);
    moved = true;
    view.classList.add("dragging");
    camera.x += dx;
    camera.y += dy;
    apply();
  }
});
const release = (e) => {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (!pointers.size) view.classList.remove("dragging");
};
view.addEventListener("pointerup", release);
view.addEventListener("pointercancel", release);
view.addEventListener("wheel", (e) => {
  if (e.target.closest("#card")) return;
  e.preventDefault();
  const box = view.getBoundingClientRect();
  zoomAt(camera.scale * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), e.clientX - box.left, e.clientY - box.top);
}, { passive: false });
$("zoom-in").onclick = () => zoomAt(camera.scale * 1.3, undefined, undefined, true);
$("zoom-out").onclick = () => zoomAt(camera.scale / 1.3, undefined, undefined, true);
$("zoom-fit").onclick = () => { close(); fit(true); };

// Person card

let selected = null;
// Each relative's years tell apart people who share a name.
function relativeRow(id, note = "") {
  const side = [note, years(person(id))].filter(Boolean).join(" · ");
  const row = el("button", { class: "relative" }, el("span", { class: "name" }, displayName(id)), side && el("span", { class: "note" }, side));
  row.onclick = () => select(id, true);
  return row;
}
function group(title, list, note) {
  if (!list.length) return null;
  return el("section", {}, el("h3", {}, title), ...list.map((id) => relativeRow(id, note?.(id))));
}
function partnerNote(id, other) {
  const d = partnership(tree, id, other) || {};
  if (d.status === "married") return d.marriage_date ? `Married ${year(d.marriage_date)}` : "Married";
  return "";
}

const walk = (start, step) => {
  const seen = new Set();
  const queue = [start];
  while (queue.length) for (const next of step(queue.shift())) if (!seen.has(next)) seen.add(next) && queue.push(next);
  return seen;
};

// The family code is kept on this device once it works.
const CODE = "family-tree-photo-code";
const savedCode = () => {
  try { return localStorage.getItem(CODE) || ""; } catch { return ""; }
};
function saveCode(code) {
  try { code ? localStorage.setItem(CODE, code) : localStorage.removeItem(CODE); } catch {}
}
async function send(method, id = "", body = null) {
  const headers = { "x-edit-code": savedCode() };
  if (body) headers["content-type"] = body.type;
  const response = await fetch(`/api/photos${id && `/${id}`}`, { method, headers, body });
  if (response.status === 403) saveCode("");
  return response;
}
// Phones take large photos, so upload a 512px square crop from the middle.
async function square(file) {
  const image = await createImageBitmap(file);
  const side = Math.min(image.width, image.height);
  const size = Math.min(512, side);
  const canvas = el("canvas", { width: size, height: size });
  canvas.getContext("2d").drawImage(image, (image.width - side) / 2, (image.height - side) / 2, side, side, 0, 0, size, size);
  return new Promise((done, fail) => canvas.toBlob((blob) => (blob ? done(blob) : fail(new Error())), "image/jpeg", 0.85));
}
const errorOf = async (response) => (await response.json().catch(() => ({}))).error || "Something went wrong. Try again.";

// The big circle in a person's card: tap it to add, change or remove their photo.
function photoEditor(id) {
  const circle = avatar(id, "lg");
  if (!PHOTOS || PLACEHOLDER.test(person(id).name)) return { circle, panel: null };
  const badge = el("span", { class: "badge", "aria-hidden": "true" });
  badge.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/></svg>';
  const button = el("button", { class: "photo", "aria-label": "Photo", "aria-expanded": "false" }, circle, badge);
  const panel = el("div", { class: "photo-panel", hidden: "" });
  const picker = el("input", { type: "file", accept: "image/*", hidden: "" });
  const show = (...kids) => {
    panel.replaceChildren(...kids.filter(Boolean), picker);
    panel.hidden = false;
    button.setAttribute("aria-expanded", "true");
  };
  const hide = () => {
    panel.hidden = true;
    button.setAttribute("aria-expanded", "false");
  };
  const note = (text, error = false) => text && el("p", { class: `status${error ? " error" : ""}` }, text);

  function menu(message = "", error = false) {
    const choose = el("button", { class: "action" }, photos[id] ? "Change photo" : "Add photo");
    choose.onclick = () => (savedCode() ? picker.click() : askCode(menu));
    const remove = photos[id] && el("button", { class: "action" }, "Remove photo");
    if (remove) {
      remove.onclick = () => {
        if (!remove.dataset.sure) return Object.assign(remove.dataset, { sure: "1" }), (remove.textContent = "Tap again to remove");
        savedCode() ? removePhoto() : askCode(removePhoto);
      };
    }
    show(note(message, error), el("div", { class: "row" }, choose, remove));
  }
  // Asks once per device. Phones only open the photo picker straight from a tap, so after the
  // code is accepted the person taps Add photo again.
  function askCode(then, message = "") {
    const input = el("input", { type: "text", placeholder: "Family code", autocomplete: "off", autocapitalize: "none", spellcheck: "false", "aria-label": "Family code" });
    const go = el("button", { class: "action primary", type: "submit" }, "Continue");
    const form = el("form", {}, el("p", { class: "status" }, "Enter the family code to change photos."), el("div", { class: "row" }, input, go), note(message, true));
    form.onsubmit = async (event) => {
      event.preventDefault();
      if (!input.value.trim()) return;
      saveCode(input.value.trim().toLowerCase());
      go.disabled = true;
      const response = await send("POST").catch(() => null);
      if (response?.status === 204) then === menu ? menu("Code saved on this device.") : then();
      else askCode(then, response?.status === 403 ? "That code isn't right." : "Couldn't connect. Try again.");
    };
    show(form);
    input.focus();
  }
  async function removePhoto() {
    show(note("Removing…"));
    const response = await send("DELETE", id).catch(() => null);
    if (response?.ok) {
      delete photos[id];
      repaint(id);
      return hide();
    }
    response?.status === 403 ? askCode(removePhoto, "That code isn't right.") : menu(response ? await errorOf(response) : "Couldn't connect. Try again.", true);
  }
  picker.onchange = async () => {
    const chosen = picker.files[0];
    picker.value = "";
    if (!chosen) return;
    show(note("Uploading…"));
    let body;
    try {
      body = await square(chosen);
    } catch {
      return menu("Couldn't read that image. Try a JPEG or PNG.", true);
    }
    const response = await send("PUT", id, body).catch(() => null);
    if (response?.ok) {
      photos[id] = (await response.json()).v;
      repaint(id);
      return hide();
    }
    response?.status === 403 ? askCode(menu, "That code isn't right.") : menu(response ? await errorOf(response) : "Couldn't connect. Try again.", true);
  };
  button.onclick = () => (panel.hidden ? menu() : hide());
  return { circle: button, panel };
}

// Lights up someone's line from the oldest ancestors down to their children (or, with branch,
// all their descendants) and fades everyone who isn't close family.
function highlight(id, branch = false) {
  unhighlight();
  const partners = partnersOf(tree, id);
  const down = branch ? walk(id, (x) => children(tree, x)) : new Set(children(tree, id));
  const line = new Set([id, ...walk(id, (x) => parentsOf(tree, x)), ...down]);
  const related = new Set([...line, ...partners, ...siblings(tree, id), ...(branch ? [...down].flatMap((d) => partnersOf(tree, d)) : [])]);
  stage.classList.add("dim");
  for (const other of ids) cards[other].classList.toggle("related", related.has(other));
  cards[id].classList.add("selected");
  for (const { path, kind, people: [a, ...rest] } of edges) {
    const on = kind === "child" ? line.has(a) && rest.some((x) => line.has(x)) : related.has(a) && related.has(rest[0]) && (line.has(a) || line.has(rest[0]));
    path.classList.toggle("on", on);
    // Shared bus segments: highlighted lines go on top so grey siblings can't cover them.
    if (on) lines.append(path);
  }
  return related;
}

function select(id, glide = false) {
  clear();
  selected = id;
  const p = person(id);
  const partners = partnersOf(tree, id);
  const up = walk(id, (x) => parentsOf(tree, x));
  const related = highlight(id);
  const branch = [...walk(id, (x) => children(tree, x))];
  const link = el("button", { class: "action" }, "Copy link");
  link.onclick = async () => {
    const url = `${location.href.split("#")[0]}#${id}`;
    try {
      await navigator.clipboard.writeText(url);
    } catch {
      // Older browsers: copy through a hidden field.
      const field = el("textarea", { readonly: "", style: "position:fixed;opacity:0" });
      field.value = url;
      document.body.append(field);
      field.select();
      document.execCommand("copy");
      field.remove();
    }
    link.textContent = "Link copied";
    setTimeout(() => (link.textContent = "Copy link"), 1500);
  };
  let toggle = null;
  if (branch.length > children(tree, id).length) {
    toggle = el("button", { class: "action", "aria-pressed": "false" }, "Show all descendants");
    toggle.onclick = () => {
      const on = toggle.getAttribute("aria-pressed") !== "true";
      toggle.setAttribute("aria-pressed", String(on));
      toggle.textContent = on ? "Hide descendants" : "Show all descendants";
      highlight(id, on);
      if (on && !inView([id, ...branch])) centreOn([id, ...branch]);
    };
  }

  const facts = [
    ["Born", [p.birth_date, p.birth_place && `in ${p.birth_place}`].filter(Boolean).join(" ")],
    ["Died", p.death_date],
  ].filter(([, v]) => v);
  const photo = photoEditor(id);
  const box = el(
    "div",
    { id: "card", role: "dialog", "aria-label": p.name },
    el("div", { class: "top" }, photo.circle, el("div", { class: "who" }, el("h2", {}, displayName(id)), lifespan(p) && el("span", { class: "years" }, lifespan(p)))),
    facts.length ? el("dl", {}, ...facts.flatMap(([k, v]) => [el("dt", {}, k), el("dd", {}, v)])) : null,
    photo.panel,
    p.notes && el("p", { class: "notes" }, p.notes),
    p.private && el("p", { class: "none" }, "Details are hidden for living people."),
    group("Parents", parentsOf(tree, id)),
    group(partners.length > 1 ? "Partners" : "Partner", partners, (o) => partnerNote(id, o)),
    group("Siblings", siblings(tree, id), (o) => (halfSiblings(tree, id, o) ? "Half" : "")),
    group("Children", children(tree, id)),
    related.size === 1 ? el("p", { class: "none" }, "No family recorded yet.") : null,
    el("div", { class: "actions" }, toggle, link),
  );
  const shut = el("button", { class: "close", "aria-label": "Close" });
  shut.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>';
  shut.onclick = close;
  box.append(shut);
  view.append(box);

  // While the tree glides to the person, the card waits at its final spot and appears on arrival.
  const frame = [id, ...up, ...children(tree, id), ...partners];
  if (glide || !inView(frame)) {
    box.classList.add("waiting");
    const show = () => {
      box.classList.remove("waiting");
      stage.removeEventListener("transitionend", arrived);
    };
    // Cards fade too; only the stage's own move counts as arriving.
    const arrived = (e) => e.target === stage && e.propertyName === "transform" && show();
    if (centreOn(frame)) {
      stage.addEventListener("transitionend", arrived);
      setTimeout(show, 600);
    } else show();
  }
  place();
  history.replaceState(null, "", `#${id}`);
}
// Positions come from the camera, not the DOM, so the card never reads a half-finished glide.
function place() {
  const box = $("card");
  if (!box || !selected || matchMedia("(max-width: 640px)").matches) return;
  const { x, y } = at(selected);
  const s = camera.scale;
  const [left, top, w] = [camera.x + x * s, camera.y + y * s, card.w * s];
  const [vw, vh, bw, bh] = [view.clientWidth, view.clientHeight, box.offsetWidth, box.offsetHeight];
  // Clear of the indented children below the person, too.
  const right = left + w + 2 * gap.indent * s + 12;
  const side = right + bw > vw - 16 ? left - bw - 12 : right;
  box.style.left = `${Math.min(Math.max(16, side), vw - bw - 16)}px`;
  box.style.top = `${Math.min(Math.max(16, top), vh - bh - 16)}px`;
}
function clear() {
  $("card")?.remove();
  if (selected) cards[selected].classList.remove("selected");
  unhighlight();
}
function unhighlight() {
  for (const { path } of edges) path.classList.remove("on");
}
function close() {
  clear();
  selected = null;
  stage.classList.remove("dim");
  history.replaceState(null, "", location.pathname);
}
stage.addEventListener("click", (e) => {
  if (moved) return;
  const node = e.target.closest(".person");
  node ? select(node.dataset.id) : close();
});
view.addEventListener("click", (e) => { if (!moved && e.target === view) close(); });
addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
addEventListener("resize", place);

// Search

const search = $("search");
const results = $("results");
let matches = [];
let active = 0;
function showResults() {
  const terms = search.value.toLowerCase().split(/\s+/).filter(Boolean);
  const name = (id) => person(id).name.toLowerCase();
  const starts = (id) => name(id).split(/\s+/).some((w) => w.startsWith(terms[0]));
  matches = terms.length
    ? ids.filter((id) => !PLACEHOLDER.test(person(id).name) && terms.every((t) => name(id).includes(t)))
        .sort((a, b) => starts(b) - starts(a)).slice(0, 8)
    : [];
  active = 0;
  results.replaceChildren(
    ...(matches.length
      ? matches.map((id, i) => {
          const item = el("li", { role: "option", "aria-selected": String(i === active) }, avatar(id), el("span", {}, el("span", { class: "name" }, person(id).name), years(person(id)) && el("span", { class: "years" }, years(person(id)))));
          item.onpointerdown = (e) => { e.preventDefault(); choose(id); };
          return item;
        })
      : [el("li", { class: "empty" }, "No one by that name")]),
  );
  results.hidden = !terms.length;
  search.setAttribute("aria-expanded", String(!results.hidden));
}
function choose(id) {
  search.value = "";
  results.hidden = true;
  search.setAttribute("aria-expanded", "false");
  search.blur();
  select(id, true);
}
search.addEventListener("input", showResults);
search.addEventListener("blur", () => { results.hidden = true; });
search.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    active = (active + (e.key === "ArrowDown" ? 1 : -1) + matches.length) % Math.max(1, matches.length);
    [...results.children].forEach((li, i) => li.setAttribute("aria-selected", String(i === active)));
  } else if (e.key === "Enter" && matches[active]) choose(matches[active]);
  else if (e.key === "Escape") { search.value = ""; showResults(); }
});

if (!ids.length) view.replaceChildren(el("div", { class: "empty-tree" }, "This family tree is empty."));
else {
  fit();
  const start = decodeURIComponent(location.hash.slice(1));
  if (tree.people[start]) select(start, true);
}
addEventListener("resize", () => { if (!selected) fit(); });
if (PHOTOS) {
  fetch("/api/photos")
    .then((response) => (response.ok ? response.json() : {}))
    .then((found) => {
      photos = found;
      Object.keys(found).forEach(repaint);
    })
    .catch(() => {});
}
</script>
