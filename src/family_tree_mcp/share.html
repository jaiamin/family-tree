<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<script>
  try { if (localStorage.getItem("theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch {}
</script>
<style>
  :root {
    --bg: #fafafa; --surface: #ffffff; --fg: #09090b; --muted: #71717a; --border: #e4e4e7;
    --border-strong: #a1a1aa; --line: #c4c4cc; --line-on: #09090b; --chip: #f4f4f5;
    --shadow: 0 1px 2px rgb(0 0 0 / .05); --shadow-lg: 0 12px 32px -8px rgb(0 0 0 / .18), 0 2px 6px rgb(0 0 0 / .06);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #09090b; --surface: #18181b; --fg: #fafafa; --muted: #a1a1aa; --border: #27272a;
    --border-strong: #52525b; --line: #3f3f46; --line-on: #fafafa; --chip: #27272a;
    --shadow: none; --shadow-lg: 0 12px 32px -8px rgb(0 0 0 / .6);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; overflow: hidden; background: var(--bg); color: var(--fg);
    font: 14px/1.45 Geist, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--fg); color: var(--bg); }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  svg.icon { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  header {
    display: flex; align-items: center; gap: 8px; padding: 12px max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left));
    padding-top: max(12px, env(safe-area-inset-top)); border-bottom: 1px solid var(--border); background: var(--surface); z-index: 3;
  }
  .title { min-width: 0; flex: 1; }
  h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .count { color: var(--muted); font-size: 13px; }
  .search { position: relative; width: min(320px, 40vw); }
  .actions { display: flex; gap: 8px; }
  .icon-button {
    display: grid; place-items: center; width: 36px; height: 36px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--muted); cursor: pointer; transition: background-color .15s, color .15s;
  }
  .icon-button:hover { background: var(--chip); color: var(--fg); }
  .icon-button svg.icon { width: 16px; height: 16px; }
  :root:not([data-theme="dark"]) .sun, :root[data-theme="dark"] .moon { display: none; }
  .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .search input {
    width: 100%; height: 36px; padding: 0 12px 0 34px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .search input::placeholder { color: var(--muted); }
  .search input::-webkit-search-cancel-button { -webkit-appearance: none; }
  .search input:focus { border-color: var(--border-strong); box-shadow: 0 0 0 3px var(--chip); }
  .results {
    position: absolute; top: calc(100% + 6px); right: 0; left: 0; margin: 0; padding: 4px; list-style: none;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-lg); max-height: 320px; overflow: auto;
  }
  .results li { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
  .results li[aria-selected="true"] { background: var(--chip); }
  .results .empty { color: var(--muted); cursor: default; }

  main { display: flex; flex: 1; min-height: 0; overflow: hidden; }
  #canvas { position: relative; flex: 1; min-width: 0; min-height: 0; overflow: hidden; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
  #canvas.dragging { cursor: grabbing; }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #stage.glide { transition: transform .45s cubic-bezier(.16, 1, .3, 1); }
  #lines { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  #lines path { fill: none; stroke: var(--line); stroke-width: 1.5; }
  #lines path.on { stroke: var(--line-on); stroke-width: 2; }
  #lines path.former { stroke-dasharray: 4 3; }
  #lines path.dot { fill: var(--line); stroke: none; }
  #lines path.dot.on { fill: var(--line-on); }

  .person {
    position: absolute; display: flex; align-items: center; gap: 10px; padding: 0 12px; text-align: left; cursor: pointer;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow);
    transition: border-color .15s, box-shadow .15s, opacity .2s;
  }
  .person.joined-top { border-radius: 10px 10px 0 0; border-bottom: 0; box-shadow: none; }
  .person.joined-bottom { border-radius: 0 0 10px 10px; box-shadow: none; }
  .person:hover { border-color: var(--border-strong); }
  /* Keep the selection outline intact at every zoom level. */
  .person.selected { z-index: 1; }
  .person.selected::after {
    content: ""; position: absolute; inset: -1px; border: 2px solid var(--fg); border-radius: inherit; pointer-events: none;
  }
  .person.unknown { border-style: dashed; box-shadow: none; background: transparent; color: var(--muted); }
  .dim .person:not(.related) { opacity: .45; }
  .avatar {
    display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; flex: none;
    background: var(--chip); color: var(--fg); font-size: 12px; font-weight: 600; letter-spacing: .02em;
  }
  .avatar.lg { width: 56px; height: 56px; font-size: 17px; }
  .avatar { position: relative; overflow: hidden; }
  .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #card .photo { position: relative; flex: none; padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; }
  #card .photo .badge {
    position: absolute; right: -2px; bottom: -2px; display: grid; place-items: center; width: 22px; height: 22px;
    border: 1px solid var(--border); border-radius: 50%; background: var(--surface); color: var(--fg);
  }
  #card .photo .badge svg.icon { width: 12px; height: 12px; }
  #card .photo:hover .avatar { filter: brightness(.94); }
  .photo-panel { display: grid; gap: 8px; margin-top: 12px; }
  .photo-panel[hidden] { display: none; }
  .photo-panel, .photo-panel form { grid-template-columns: minmax(0, 1fr); }
  .photo-panel form { display: grid; gap: 8px; }
  .photo-panel .row { display: flex; gap: 8px; }
  .photo-panel input[type="text"] {
    flex: 1; min-width: 0; height: 36px; padding: 0 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); outline: none; font-size: 14px;
  }
  .photo-panel input[type="text"]:focus { border-color: var(--border-strong); box-shadow: 0 0 0 3px var(--chip); }
  .photo-panel .status { margin: 0; font-size: 13px; color: var(--muted); }
  .photo-panel .status.error { color: var(--fg); font-weight: 500; }
  .name { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .years { display: block; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .person .text { min-width: 0; }

  .zoom {
    position: absolute; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); z-index: 2;
    display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden;
  }
  .zoom button { display: grid; place-items: center; width: 36px; height: 36px; border: 0; background: none; cursor: pointer; }
  .zoom button + button { border-top: 1px solid var(--border); }
  .zoom button:hover { background: var(--chip); }

  #card {
    position: relative; display: flex; flex-direction: column; flex: 0 0 320px; min-height: 0; overflow: hidden; padding: 16px;
    background: var(--surface); border-left: 1px solid var(--border); cursor: auto; user-select: text; -webkit-user-select: text;
  }
  #card:not(.waiting) { animation: rise .2s cubic-bezier(.16, 1, .3, 1); }
  #card.waiting { visibility: hidden; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
  #card .details-body { min-height: 0; overflow: auto; overscroll-behavior: contain; }
  #card .sheet-toggle { display: none; }
  #card .top { flex: none; display: flex; align-items: center; gap: 12px; padding-right: 28px; }
  #card h2 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  #card .close { position: absolute; top: 10px; right: 10px; display: grid; place-items: center; width: 28px; height: 28px; border: 0; border-radius: 6px; background: none; color: var(--muted); cursor: pointer; }
  #card .close:hover { background: var(--chip); color: var(--fg); }
  #card dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 14px 0 0; font-size: 13px; }
  #card dt { color: var(--muted); }
  #card dd { margin: 0; }
  #card .notes { margin: 12px 0 0; font-size: 13px; white-space: pre-line; }
  #card section { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
  #card h3 { margin: 0 0 6px; font-size: 12px; font-weight: 500; color: var(--muted); }
  .relative {
    display: flex; align-items: center; gap: 10px; padding: 7px 8px; margin: 0 -8px; width: calc(100% + 16px);
    border: 0; border-radius: 8px; background: none; text-align: left; cursor: pointer;
  }
  .relative:hover { background: var(--chip); }
  .relative .name { min-width: 0; }
  .relative .note { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
  #card .actions { display: flex; gap: 8px; margin-top: 16px; }
  #card .action {
    flex: 1; height: 36px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; white-space: nowrap;
    background: var(--surface); font-size: 13px; font-weight: 500; cursor: pointer; transition: background-color .15s;
  }
  #card .action:hover { background: var(--chip); }
  #card .action:disabled { opacity: .6; cursor: default; }
  #card .who { min-width: 0; }
  #card .none { margin: 14px 0 0; color: var(--muted); font-size: 13px; }
  .empty-tree { display: grid; place-items: center; height: 100%; color: var(--muted); }

  @media (max-width: 640px) {
    header { gap: 8px; }
    main { flex-direction: column; }
    #card {
      flex: none; height: 38dvh; max-height: 320px; border-left: 0; border-top: 1px solid var(--border);
      padding-bottom: max(16px, env(safe-area-inset-bottom));
    }
    #card.expanded { height: 70dvh; max-height: none; }
    #card .sheet-toggle { display: block; flex: none; align-self: flex-start; margin: 8px 0 0; padding: 4px 0; border: 0; background: none; text-decoration: underline; cursor: pointer; }
    #card:not(.waiting) { animation-name: sheet; }
    @keyframes sheet { from { transform: translateY(24px); opacity: 0; } }
  }
  @media (prefers-reduced-motion: reduce) { #stage.glide, #card { transition: none; animation: none; } }
</style>
</head>
<body>
<header>
  <div class="title">
    <h1 id="title"></h1>
    <div class="count" id="count"></div>
  </div>
  <div class="search">
    <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="search" type="search" placeholder="Find a person" autocomplete="off" aria-label="Find a person"
      role="combobox" aria-expanded="false" aria-controls="results">
    <ul class="results" id="results" role="listbox" hidden></ul>
  </div>
  <div class="actions">
    <a class="icon-button" href="https://github.com/jaiamin/family-tree-mcp" target="_blank" rel="noopener" aria-label="family-tree-mcp on GitHub" title="GitHub">
      <svg class="icon" viewBox="0 0 24 24"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
    </a>
    <button class="icon-button" id="theme" aria-label="Switch light or dark mode" title="Light or dark">
      <svg class="icon moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      <svg class="icon sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>
  </div>
</header>
<main id="view" aria-label="Family tree">
  <div id="canvas">
  <div id="stage"><svg id="lines"></svg></div>
  <div class="zoom">
    <button id="zoom-in" aria-label="Zoom in"><svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button id="zoom-out" aria-label="Zoom out"><svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button id="zoom-fit" aria-label="Show everyone"><svg class="icon" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></button>
  </div>
  </div>
</main>
<script id="tree-data" type="application/json">__DATA__</script>
<script>

</script>
<script>

</script>
<script>

</script>

</body>
</html>
