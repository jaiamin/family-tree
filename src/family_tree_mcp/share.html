<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>__TITLE__</title>
<style>
  :root {
    --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b; --line: #e2e8f0;
    --accent: #d97706; --chip: #f1f5f9;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b1120; --card: #111827; --text: #e5e7eb; --muted: #94a3b8; --line: #1f2937; --chip: #1f2937; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 20px 16px 8px; max-width: 1400px; margin: 0 auto; }
  h1 { margin: 0; font-size: 1.5rem; }
  .sub { color: var(--muted); font-size: .9rem; }
  main { display: grid; grid-template-columns: 1fr 320px; gap: 16px; padding: 8px 16px 24px; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  select, button { font: inherit; color: var(--text); background: var(--chip); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  button { cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .seg { display: inline-flex; gap: 4px; }
  .spacer { flex: 1; }
  #chart { overflow: auto; background: #fff; border-radius: 8px; max-height: 75vh; padding: 8px; touch-action: pan-x pan-y pinch-zoom; }
  #chart svg { display: block; margin: 0 auto; height: auto; }
  #chart g.node[data-person] { cursor: pointer; }
  h2 { font-size: 1rem; margin: 0 0 8px; }
  h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 12px 0 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--chip); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: .9rem; cursor: pointer; }
  .muted { color: var(--muted); }
  aside .card + .card { margin-top: 16px; }
  #answer { margin-top: 10px; font-weight: 600; }
  .row { display: grid; gap: 8px; }
  .row select { width: 100%; }
  footer { text-align: center; color: var(--muted); font-size: .8rem; padding: 0 16px 24px; }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div class="sub" id="subtitle"></div>
</header>
<main>
  <section class="card">
    <div class="toolbar">
      <select id="focus" aria-label="Center on person"></select>
      <span class="seg" id="views" role="group" aria-label="View">
        <button data-view="both">Family</button>
        <button data-view="ancestors">Ancestors</button>
        <button data-view="descendants">Descendants</button>
      </span>
      <select id="generations" aria-label="Generations">
        <option value="">All generations</option>
        <option value="1">1 generation</option>
        <option value="2">2 generations</option>
        <option value="3" selected>3 generations</option>
        <option value="4">4 generations</option>
      </select>
      <span class="spacer"></span>
      <span class="seg">
        <button id="zoom-out" aria-label="Zoom out">−</button>
        <button id="zoom-fit">Fit</button>
        <button id="zoom-in" aria-label="Zoom in">+</button>
      </span>
    </div>
    <div id="chart" aria-live="polite">Loading…</div>
  </section>
  <aside>
    <div class="card" id="person"><span class="muted">Click anyone in the tree to see their details.</span></div>
    <div class="card">
      <h2>How are they related?</h2>
      <div class="row">
        <select id="rel-a" aria-label="First person"></select>
        <select id="rel-b" aria-label="Second person"></select>
      </div>
      <div id="answer"></div>
    </div>
  </aside>
</main>
<footer>Read-only family tree · made with family-tree-mcp</footer>
<script id="tree-data" type="application/json">__DATA__</script>
<script>
__SHARE_JS__
</script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script>
const tree = JSON.parse(document.getElementById("tree-data").textContent);
const ids = Object.keys(tree.people);
const byName = [...ids].sort((a, b) => tree.people[a].name.localeCompare(tree.people[b].name));
const state = { focus: null, view: "both", generations: 3, scale: 1, natural: 0, nodes: {} };
const $ = (id) => document.getElementById(id);

$("title").textContent = tree.name;
$("subtitle").textContent = `${ids.length} people` + (tree.description ? ` · ${tree.description}` : "");
document.title = tree.name;

function options(select, first) {
  select.innerHTML = "";
  if (first) select.add(new Option(first, ""));
  byName.forEach((id) => select.add(new Option(tree.people[id].name, id)));
}
options($("focus"), "Everyone");
options($("rel-a"), "Choose a person");
options($("rel-b"), "Choose a person");

function years(p) {
  const y = (d) => d?.match(/\d{4}/)?.[0] || d;
  if (p.birth_date && p.death_date) return `${y(p.birth_date)}–${y(p.death_date)}`;
  if (p.birth_date) return `Born ${p.birth_date}`;
  if (p.death_date) return `Died ${p.death_date}`;
  return "";
}

function chips(title, list, note = () => "") {
  if (!list.length) return null;
  const section = document.createElement("div");
  section.innerHTML = '<h3></h3><div class="chips"></div>';
  section.querySelector("h3").textContent = title;
  list.forEach((other) => {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.textContent = tree.people[other].name + note(other);
    chip.onclick = () => focusOn(other);
    section.querySelector(".chips").append(chip);
  });
  return section;
}

function partnerNote(id, other) {
  const details = partnership(tree, id, other) || {};
  const status = details.status === "married" && details.marriage_date
    ? `married ${details.marriage_date}` : details.status;
  return status ? ` · ${status}` : "";
}

function showPerson(id) {
  const p = tree.people[id];
  const box = $("person");
  box.innerHTML = `<h2></h2><div class="muted" data-f="years"></div><div class="muted" data-f="place"></div>
    <p data-f="notes"></p>`;
  box.querySelector("h2").textContent = p.name;
  box.querySelector('[data-f="years"]').textContent = years(p);
  box.querySelector('[data-f="place"]').textContent = p.birth_place ? `Born in ${p.birth_place}` : "";
  box.querySelector('[data-f="notes"]').textContent = p.notes || "";
  box.append(...[
    chips("Parents", p.parents || []),
    chips("Partners", p.partners || [], (other) => partnerNote(id, other)),
    chips("Siblings", siblings(tree, id), (other) => (halfSiblings(tree, id, other) ? " · half" : "")),
    chips("Children", children(tree, id)),
  ].filter(Boolean));
  $("rel-a").value ||= id;
}

function focusOn(id) {
  state.focus = id || null;
  $("focus").value = id || "";
  if (id) showPerson(id);
  render();
}

let renders = 0;
async function render() {
  const { source, nodes } = toMermaid(tree, state.focus, state.view, state.focus ? state.generations : null);
  state.nodes = nodes;
  document.querySelectorAll("#views button").forEach((b) => {
    b.disabled = !state.focus;
    b.setAttribute("aria-pressed", String(!!state.focus && b.dataset.view === state.view));
  });
  $("generations").disabled = !state.focus;
  if (!ids.length) { $("chart").textContent = "This tree is empty."; return; }
  const { svg } = await mermaid.render(`chart${++renders}`, source);
  $("chart").innerHTML = svg;
  const el = $("chart").querySelector("svg");
  state.natural = el.viewBox.baseVal.width || el.getBoundingClientRect().width;
  el.style.maxWidth = "none";
  el.querySelectorAll("g.node").forEach((g) => {
    const match = g.id.match(/flowchart-(p\d+)-/);
    if (!match) return;
    g.dataset.person = nodes[match[1]];
    g.addEventListener("click", () => focusOn(g.dataset.person));
  });
  zoom(Math.max(fitScale(), 0.6));
  $("chart").scrollLeft = ($("chart").scrollWidth - $("chart").clientWidth) / 2;
}

function zoom(scale) {
  state.scale = Math.min(3, Math.max(0.2, scale));
  $("chart").querySelector("svg").style.width = `${state.natural * state.scale}px`;
}
const fitScale = () => Math.min(1, ($("chart").clientWidth - 16) / state.natural);
const fit = () => zoom(fitScale());

$("focus").onchange = (e) => focusOn(e.target.value);
document.querySelectorAll("#views button").forEach((b) => {
  b.onclick = () => { state.view = b.dataset.view; render(); };
});
$("generations").onchange = (e) => { state.generations = e.target.value ? Number(e.target.value) : null; render(); };
$("zoom-in").onclick = () => zoom(state.scale * 1.25);
$("zoom-out").onclick = () => zoom(state.scale / 1.25);
$("zoom-fit").onclick = fit;

function answer() {
  const a = $("rel-a").value;
  const b = $("rel-b").value;
  if (!a || !b) { $("answer").textContent = ""; return; }
  const rel = relationship(tree, a, b);
  $("answer").textContent = rel.summary ||
    (rel.relationship === "same person" ? "That's the same person." : `No known relationship between ${tree.people[a].name} and ${tree.people[b].name}.`);
}
$("rel-a").onchange = answer;
$("rel-b").onchange = answer;

mermaid.initialize({ startOnLoad: false, securityLevel: "strict" });
render();
</script>
</body>
</html>
