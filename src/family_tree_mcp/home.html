<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<script>
  try { if (localStorage.getItem("theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch {}
</script>
<style>
  __SHELL_CSS__
  body { min-height: 100%; }
  main { width: min(100%, 1000px); margin: 0 auto; padding: 40px 24px; }
  h2 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
  .intro { margin: 8px 0 24px; color: var(--muted); }
  .trees { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 16px; list-style: none; margin: 0; padding: 0; }
  .tree-card { display: flex; flex-direction: column; height: 100%; padding: 24px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); color: inherit; text-decoration: none; transition: border-color .15s, background-color .15s; }
  .tree-card:hover { border-color: var(--border-strong); background: var(--chip); }
  .tree-card h3 { margin: 0; font-size: 17px; font-weight: 600; overflow-wrap: anywhere; }
  .tree-card p { margin: 8px 0 0; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .tree-card dl { display: flex; gap: 40px; margin: auto 0 0; padding-top: 28px; }
  .tree-card dl div { display: flex; flex-direction: column-reverse; }
  .tree-card dt { font-size: 13px; color: var(--muted); }
  .tree-card dd { margin: 0 0 2px; font-size: 24px; font-weight: 500; font-variant-numeric: tabular-nums; }
  @media (max-width: 640px) { main { padding: 28px 16px; } }
  @media (prefers-reduced-motion: reduce) { .tree-card { transition: none; } }
</style>
</head>
<body>
__HEADER__
<main>
<h2>Family trees</h2>
<p class="intro">Choose a tree to explore your family connections.</p>
__TREES__
</main>
<script>
  document.getElementById("theme").onclick = () => {
    const dark = document.documentElement.dataset.theme !== "dark";
    dark ? document.documentElement.dataset.theme = "dark" : delete document.documentElement.dataset.theme;
    try { localStorage.setItem("theme", dark ? "dark" : "light"); } catch {}
  };
</script>
</body>
</html>
