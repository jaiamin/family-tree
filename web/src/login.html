<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Family trees</title>
<link rel="icon" href="__BASE__/favicon.svg" type="image/svg+xml">
<script>try{if(localStorage.getItem("theme")==="dark")document.documentElement.dataset.theme="dark"}catch{}</script>
<style>__SHELL_CSS__ __CLIENT_CSS__</style>
<script src="__BASE__/app.js" defer></script>
</head>
<body data-family-base="__BASE__" data-login="true">
<main class="login-main">
<div class="login-content">
<h1 id="login-title"><span class="skeleton skeleton-site" aria-hidden="true">&nbsp;</span></h1>
<form id="family-login">
<label for="family-password">Password</label>
<div class="password-field">
<input id="family-password" name="password" type="password" autocomplete="current-password" aria-describedby="login-status" required maxlength="200">
<button class="password-toggle" id="password-toggle" type="button" aria-controls="family-password" aria-pressed="false" aria-label="Show password">Show</button>
</div>
<p class="form-status" id="login-status" role="status"></p>
<button class="site-button primary" type="submit">Continue</button>
</form>
</div>
</main>
</body>
</html>
