name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
  mcp:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run pytest
  web:
    runs-on: ubuntu-latest
    env:
      FAMILY_INSTALLATION_CONFIG: installation.example.json
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - run: pnpm --dir web check
      - run: pnpm --dir web test
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm --dir web test:browser
      - name: Verify root and custom deployment paths
        run: |
          env -u FAMILY_INSTALLATION_CONFIG BASE_PATH= pnpm --dir web test:browser
          env -u FAMILY_INSTALLATION_CONFIG BASE_PATH=/our/family pnpm --dir web test:browser
          pnpm --dir web build
      - run: pnpm --dir web exec vite build
      - run: pnpm --dir web exec cf deploy --prebuilt --mode production --dry-run
  local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: node web/tests/docker-smoke.mjs
