name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff format --check .
        if: matrix.python == '3.14'
      - run: uv run ruff check .
        if: matrix.python == '3.14'
      - run: uv run ty check
      - run: uv run pytest
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FAMILY_INSTALLATION_CONFIG: installation.example.json
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - run: pnpm --dir web check
      - run: pnpm --dir web test
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Browser suite
        run: pnpm --dir web test:browser --output=test-results/default
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/default
      - name: Verify root and custom deployment paths
        run: |
          env -u FAMILY_INSTALLATION_CONFIG BASE_PATH= PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report/root pnpm --dir web test:browser installation.spec.mjs --output=test-results/root
          env -u FAMILY_INSTALLATION_CONFIG BASE_PATH=/our/family PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report/custom pnpm --dir web test:browser installation.spec.mjs --output=test-results/custom
          pnpm --dir web build
      - run: pnpm --dir web exec vite build
      - run: pnpm --dir web exec cf deploy --prebuilt --mode production --dry-run
      - name: Browser failure diagnostics
        if: failure() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-diagnostics
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
          if-no-files-found: ignore
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          load: true
          tags: family-tree-ci:local
          cache-from: type=gha,scope=family-tree-local
          cache-to: type=gha,scope=family-tree-local,mode=max
      - run: node web/tests/docker-smoke.mjs
        env:
          DOCKER_TEST_IMAGE: family-tree-ci:local
