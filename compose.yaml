services:
  family-tree:
    build:
      context: ./web
      args:
        BASE_PATH: ${BASE_PATH-/family-tree}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set your HTTPS origin}
      BASE_PATH: ${BASE_PATH-/family-tree}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set your Google web client ID}
      OWNER_EMAIL: ${OWNER_EMAIL:?Set the owner Google email}
      FAMILY_PASSWORD: ${FAMILY_PASSWORD:?Set a strong shared family password}
    volumes:
      - family-data:/data
      - ${BACKUP_DIRECTORY:?Choose a private backup directory}:/backup
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  family-data:
